version: '3.9'

services:

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"

    volumes:
      - ./frontend:/app
      - /app/node_modules

  backend:
    build: ./backend
    ports:
      - "8000:8000"

    volumes:
      - ./backend:/app

    depends_on:
      - db

  db:
    image: postgres:15

    restart: always

    environment:
      POSTGRES_DB: sessionsdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

  nginx:
    image: nginx:latest

    ports:
      - "80:80"

    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf

    depends_on:
      - frontend
      - backend